services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: python-app

    ports:
      - "8501:8501"

    restart: unless-stopped

    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s