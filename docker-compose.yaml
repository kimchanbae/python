services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: python-app

    ports:
      - "8501:8501"

    restart: unless-stopped

    # Docker 배포 환경변수
    env_file:
      - .env.docker

    environment:
      APP_ENV: ${APP_ENV:-docker}
      API_URL: ${API_URL:-http://fastapi:8000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CHROMA_HOST: ${CHROMA_HOST:-chromadb}
      CHROMA_PORT: ${CHROMA_PORT:-8000}

    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s