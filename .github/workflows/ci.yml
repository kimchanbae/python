name: Python CI - Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Python 환경 설정  
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      
      # 3. Python 라이브러리 설치      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 4. 테스트 실행
      - name: Run tests
        run: |
          python -m pytest -v

      # 5. Docker 이미지 이름 설정
      - name: Set lowercase image name
        if: github.event_name == 'push'
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/python-api" >> $GITHUB_ENV

      # 6. GHCR 로그인
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Docker 이미지 빌드 및 Push
      - name: Build and publish image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      